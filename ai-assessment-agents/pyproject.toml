[project]
name = "ai-assessment-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mdnoorshid", email = "mdnoorshid2025@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "email-validator>=2.3.0",
    "langchain-core>=0.3.86",
    "langchain-ollama>=0.3.10",
    "langgraph>=0.6.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.1",
    "streamlit>=1.50.0",
]

[project.scripts]
ai-assessment-agents = "assessment_agents.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assessment_agents"
module-root = "."

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
